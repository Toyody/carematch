openapi: 3.1.0
info:
  title: CareMatch API
  version: 0.10.0
  description: |
    REST API for the CareMatch healthcare recruitment platform.

    The first-party SPA authenticates with a Laravel Sanctum stateful
    cookie session. Browser clients must first call `GET /sanctum/csrf-cookie`,
    include credentials on subsequent requests, and send the decoded
    `XSRF-TOKEN` cookie value in the `X-XSRF-TOKEN` header on state-changing
    requests.

    CareMatch does not expose personal access token issuing or management APIs
    in Phase 2-A. Phase 2-B resolves tenant access from the authenticated user,
    the organisation route identifier, and an active persisted membership before
    tenant-owned controllers run. Phase 3A applies that boundary to Candidate
    resources and scopes every nested Candidate identifier to its route Organisation.
    Phase 3B applies the same boundary to Job profiles and their explicit lifecycle.
    Phase 4 adds tenant-safe Applications and the recruitment pipeline. Phase 5A
    adds private Candidate documents. Document contents have no public storage URL;
    every metadata, download, upload, and delete operation is tenant-authorised.
  license:
    name: All rights reserved
servers:
  - url: /api/v1
    description: Version 1 API
paths:
  /health:
    get:
      security: []
      operationId: getHealth
      summary: Check API availability
      tags:
        - System
      responses:
        "200":
          description: The API is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /auth/register:
    post:
      security: []
      operationId: registerUser
      summary: Register a global user
      description: |
        Creates a global CareMatch user without creating Organisation or
        membership data. The new user is authenticated with the web session and
        the session identifier is regenerated. An already authenticated session
        is rejected by the guest-only API policy.
      tags:
        - Identity
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: The user was registered and authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "409":
          $ref: "#/components/responses/GuestOnlyConflict"
        "419":
          $ref: "#/components/responses/CsrfTokenMismatch"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/login:
    post:
      security: []
      operationId: loginUser
      summary: Log in with a web session
      description: |
        Authenticates the normalised email and password using Laravel's web
        guard, then regenerates the session identifier. Unknown email addresses
        and incorrect passwords return the same public failure. Remember-me is
        not supported. An already authenticated session is rejected.
      tags:
        - Identity
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: The credentials are incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialFailure"
        "409":
          $ref: "#/components/responses/GuestOnlyConflict"
        "419":
          $ref: "#/components/responses/CsrfTokenMismatch"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Get the current global user
      description: Returns the user authenticated by the stateful cookie session.
      tags:
        - Identity
      security:
        - StatefulSession: []
      responses:
        "200":
          description: The authenticated global user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /auth/logout:
    post:
      operationId: logoutUser
      summary: Log out the current session
      description: |
        Logs out the Laravel web guard, invalidates the current session, and
        regenerates the CSRF token.
      tags:
        - Identity
      security:
        - StatefulSession: []
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
      responses:
        "204":
          description: The current session was logged out and invalidated.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "419":
          $ref: "#/components/responses/CsrfTokenMismatch"
  /auth/forgot-password:
    post:
      security: []
      operationId: requestPasswordReset
      summary: Request a password reset link
      description: |
        Requests Laravel's standard password reset notification. The public
        response is identical whether or not the email belongs to a user. An
        already authenticated session is rejected by the guest-only API policy.
      tags:
        - Identity
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: The password reset request was accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgotPasswordAcceptedResponse"
        "409":
          $ref: "#/components/responses/GuestOnlyConflict"
        "419":
          $ref: "#/components/responses/CsrfTokenMismatch"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/reset-password:
    post:
      security: []
      operationId: resetPassword
      summary: Reset a password
      description: |
        Uses Laravel Password Broker to validate and consume the reset token.
        Success changes the password, rotates the remember token, and invalidates
        all database-backed sessions belonging to the user. It does not
        automatically log the user in. Invalid, expired, and previously used
        tokens share the same validation error contract. An already authenticated
        session is rejected.
      tags:
        - Identity
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: The password was reset and existing user sessions were invalidated.
        "409":
          $ref: "#/components/responses/GuestOnlyConflict"
        "419":
          $ref: "#/components/responses/CsrfTokenMismatch"
        "422":
          description: |
            Input validation failed, or the reset token is invalid, expired, or
            has already been used.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /organisations:
    get:
      operationId: listOrganisations
      summary: List the current user's organisations
      description: |
        Returns only organisations for which the authenticated global user has
        an active membership. A membership is active when it has not been
        deactivated. The response includes that user's fixed role in each
        organisation.
      tags:
        - Organisation
      security:
        - StatefulSession: []
      responses:
        "200":
          description: The organisations with active memberships for the current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createOrganisation
      summary: Create an organisation
      description: |
        Atomically creates an organisation and an active initial membership for
        the authenticated global user with the `admin` role. Ownership and role
        identifiers are derived by the server and are not accepted from the
        client.
      tags:
        - Organisation
      security:
        - StatefulSession: []
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganisationRequest"
      responses:
        "201":
          description: The organisation and initial Admin membership were created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "419":
          $ref: "#/components/responses/CsrfTokenMismatch"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /organisations/{organisation}:
    parameters:
      - $ref: "#/components/parameters/OrganisationId"
    get:
      operationId: getOrganisation
      summary: Get an accessible organisation
      description: |
        Resolves the route organisation against the authenticated user's active
        persisted membership. Nonexistent organisations, organisations without
        a membership for the user, and deactivated memberships all return the
        same `404` response.
      tags:
        - Organisation
      security:
        - StatefulSession: []
      responses:
        "200":
          description: The organisation and the current user's membership role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/TenantNotFound"
    patch:
      operationId: updateOrganisation
      summary: Update organisation settings
      description: |
        Updates the accessible organisation identified by the route. An active
        Admin membership is required. Recruiter and Hiring Manager memberships
        are valid tenant access but are not authorised to update settings.
        Ownership and membership identifiers are derived by the server and are
        not accepted from the request body.
      tags:
        - Organisation
      security:
        - StatefulSession: []
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganisationRequest"
      responses:
        "200":
          description: The organisation name was updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/TenantNotFound"
        "419":
          $ref: "#/components/responses/CsrfTokenMismatch"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /organisations/{organisation}/candidates:
    parameters:
      - $ref: "#/components/parameters/OrganisationId"
    get:
      operationId: listCandidates
      summary: List candidates in an organisation
      description: |
        Returns a bounded, paginated list scoped to the trusted route Organisation.
        Search is a case-insensitive literal substring match across first name,
        last name, combined first/last name, and email. Occupation is an exact
        filter. All active Organisation roles may list Candidates.
      tags:
        - Candidate
      security:
        - StatefulSession: []
      parameters:
        - name: search
          in: query
          description: Case-insensitive literal substring matched against Candidate name and email.
          schema:
            type: string
            maxLength: 255
        - name: occupation
          in: query
          description: Exact occupation value to filter by.
          schema:
            type: string
            maxLength: 255
        - name: sort
          in: query
          description: Allow-listed Candidate sort. Defaults to `created_at`.
          schema:
            type: string
            enum: [name, created_at]
            default: created_at
        - name: direction
          in: query
          description: Sort direction. Defaults to `desc`.
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          description: Results per page. The server-enforced maximum is 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Tenant-scoped paginated Candidates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/TenantNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
      operationId: createCandidate
      summary: Create a candidate in an organisation
      description: |
        Creates a Candidate owned by the trusted route Organisation. The server
        derives `organisation_id` from TenantContext and does not accept ownership
        fields from the client. Admin and Recruiter roles may create Candidates.
      tags:
        - Candidate
      security:
        - StatefulSession: []
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCandidateRequest"
      responses:
        "201":
          description: The Candidate was created in the route Organisation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/TenantNotFound"
        "419":
          $ref: "#/components/responses/CsrfTokenMismatch"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /organisations/{organisation}/candidates/{candidate}:
    parameters:
      - $ref: "#/components/parameters/OrganisationId"
      - $ref: "#/components/parameters/CandidateId"
    get:
      operationId: getCandidate
      summary: Get a tenant-scoped candidate
      description: |
        Resolves the Candidate using both the trusted Organisation identifier and
        Candidate identifier. A Candidate from another Organisation and a missing
        Candidate return the same `404` response. All active roles may view.
      tags:
        - Candidate
      security:
        - StatefulSession: []
      responses:
        "200":
          description: The tenant-scoped Candidate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/CandidateNotFound"
    patch:
      operationId: updateCandidate
      summary: Update a tenant-scoped candidate
      description: |
        Partially updates a Candidate resolved within the trusted route Organisation.
        Ownership and timestamps cannot be changed. Admin and Recruiter roles may
        update; Hiring Managers receive `403`.
      tags:
        - Candidate
      security:
        - StatefulSession: []
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCandidateRequest"
      responses:
        "200":
          description: The Candidate was updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/CandidateNotFound"
        "419":
          $ref: "#/components/responses/CsrfTokenMismatch"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /organisations/{organisation}/candidates/{candidate}/documents:
    parameters:
      - $ref: "#/components/parameters/OrganisationId"
      - $ref: "#/components/parameters/CandidateId"
    get:
      operationId: listCandidateDocuments
      summary: List a Candidate's private document metadata
      description: |
        Returns metadata for documents belonging to the Candidate within the trusted
        route Organisation, newest first with an ID tie-break. All active roles may
        list documents. Storage keys, filesystem paths, public URLs, and file contents
        are never returned.
      tags: [Candidate]
      security:
        - StatefulSession: []
      responses:
        "200":
          description: Tenant- and Candidate-scoped document metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateDocumentListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/CandidateDocumentNotFound"
    post:
      operationId: uploadCandidateDocument
      summary: Upload a private Candidate document
      description: |
        Admin and Recruiter may upload a non-empty PDF or DOCX of at most 10 MiB.
        The backend determines MIME and size from the uploaded file, generates a
        cryptographically random internal storage key, stores the content on a
        private disk, and then persists metadata. Original names are display and
        attachment metadata only and never determine the storage path. Malware
        scanning is not implemented in the portfolio MVP.
      tags: [Candidate]
      security:
        - StatefulSession: []
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CandidateDocumentUploadRequest"
      responses:
        "201":
          description: The document content and metadata were stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateDocumentResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/CandidateDocumentNotFound"
        "419":
          $ref: "#/components/responses/CsrfTokenMismatch"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/CandidateDocumentStorageFailure"
  /organisations/{organisation}/candidates/{candidate}/documents/{document}/download:
    parameters:
      - $ref: "#/components/parameters/OrganisationId"
      - $ref: "#/components/parameters/CandidateId"
      - $ref: "#/components/parameters/CandidateDocumentId"
    get:
      operationId: downloadCandidateDocument
      summary: Download an authorised private Candidate document
      description: |
        All active roles may download after the Organisation, Candidate, and Document
        are resolved together. The backend reads the private object through its
        internal key and returns an attachment using the safe stored original-name
        metadata. No direct or public storage URL is issued.
      tags: [Candidate]
      security:
        - StatefulSession: []
      responses:
        "200":
          description: Private document bytes returned as an attachment.
          headers:
            Content-Disposition:
              description: Attachment disposition using the safe original filename metadata.
              schema: { type: string }
          content:
            application/pdf:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: { type: string, format: binary }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/CandidateDocumentNotFound"
        "500":
          $ref: "#/components/responses/CandidateDocumentStorageFailure"
  /organisations/{organisation}/candidates/{candidate}/documents/{document}:
    parameters:
      - $ref: "#/components/parameters/OrganisationId"
      - $ref: "#/components/parameters/CandidateId"
      - $ref: "#/components/parameters/CandidateDocumentId"
    delete:
      operationId: deleteCandidateDocument
      summary: Delete a private Candidate document
      description: |
        Admin and Recruiter may delete. The private object is removed before its
        metadata row so a database failure cannot leave the sensitive content
        accessible through the application. Hiring Managers receive `403`.
      tags: [Candidate]
      security:
        - StatefulSession: []
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
      responses:
        "204":
          description: The private object and metadata were deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/CandidateDocumentNotFound"
        "419":
          $ref: "#/components/responses/CsrfTokenMismatch"
        "500":
          $ref: "#/components/responses/CandidateDocumentStorageFailure"
  /organisations/{organisation}/jobs:
    parameters:
      - $ref: "#/components/parameters/OrganisationId"
    get:
      operationId: listJobs
      summary: List jobs in an organisation
      description: |
        Returns a bounded tenant-scoped page. Search is a case-insensitive literal
        title substring. Status, occupation, and employment type are exact filters.
        All active Organisation roles may list Jobs; unsupported query parameters
        are rejected.
      tags: [Job]
      security:
        - StatefulSession: []
      parameters:
        - name: search
          in: query
          schema: { type: string, maxLength: 200 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/JobStatus" }
        - name: occupation
          in: query
          schema: { type: string, maxLength: 255 }
        - name: employment_type
          in: query
          schema: { type: string, maxLength: 100 }
        - name: sort
          in: query
          description: Opening-date sorting places null values last in either direction and uses Job ID as a deterministic tie-breaker.
          schema: { type: string, enum: [opened_at, created_at], default: created_at }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Tenant-scoped paginated Jobs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobListResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/TenantNotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      operationId: createJob
      summary: Create a draft job
      description: |
        Creates a Job owned by the trusted route Organisation. The server derives
        ownership and always creates status `draft`; status and ownership fields
        are not accepted from the client. Admin and Recruiter roles may create.
      tags: [Job]
      security:
        - StatefulSession: []
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateJobRequest" }
      responses:
        "201":
          description: A draft Job was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/TenantNotFound" }
        "419": { $ref: "#/components/responses/CsrfTokenMismatch" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /organisations/{organisation}/jobs/{job}:
    parameters:
      - $ref: "#/components/parameters/OrganisationId"
      - $ref: "#/components/parameters/JobId"
    get:
      operationId: getJob
      summary: Get a tenant-scoped job
      description: A cross-tenant Job identifier and a nonexistent identifier have identical `404` semantics.
      tags: [Job]
      security:
        - StatefulSession: []
      responses:
        "200":
          description: The tenant-scoped Job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/JobNotFound" }
    patch:
      operationId: updateJob
      summary: Update a tenant-scoped job profile
      description: |
        Partially updates profile fields for a tenant-scoped Job. Status is not a
        profile field and must use a lifecycle endpoint. Admin and Recruiter may
        update; Hiring Managers receive `403`.
      tags: [Job]
      security:
        - StatefulSession: []
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateJobRequest" }
      responses:
        "200":
          description: The Job profile was updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/JobNotFound" }
        "419": { $ref: "#/components/responses/CsrfTokenMismatch" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /organisations/{organisation}/jobs/{job}/open:
    post:
      operationId: openJob
      summary: Open or reopen a job
      description: Transitions `draft` or `closed` to `open`. Profile dates are not changed automatically.
      tags: [Job]
      security:
        - StatefulSession: []
      parameters:
        - $ref: "#/components/parameters/OrganisationId"
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/XsrfToken"
      responses:
        "200":
          description: The Job is open.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/JobNotFound" }
        "409": { $ref: "#/components/responses/JobTransitionConflict" }
        "419": { $ref: "#/components/responses/CsrfTokenMismatch" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /organisations/{organisation}/jobs/{job}/close:
    post:
      operationId: closeJob
      summary: Close an open job
      description: Transitions `open` to `closed`. Profile dates are not changed automatically.
      tags: [Job]
      security:
        - StatefulSession: []
      parameters:
        - $ref: "#/components/parameters/OrganisationId"
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/XsrfToken"
      responses:
        "200":
          description: The Job is closed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/JobNotFound" }
        "409": { $ref: "#/components/responses/JobTransitionConflict" }
        "419": { $ref: "#/components/responses/CsrfTokenMismatch" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /organisations/{organisation}/jobs/{job}/archive:
    post:
      operationId: archiveJob
      summary: Archive a job
      description: Transitions a `draft`, `open`, or `closed` Job to terminal status `archived`.
      tags: [Job]
      security:
        - StatefulSession: []
      parameters:
        - $ref: "#/components/parameters/OrganisationId"
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/XsrfToken"
      responses:
        "200":
          description: The Job is archived.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/JobNotFound" }
        "409": { $ref: "#/components/responses/JobTransitionConflict" }
        "419": { $ref: "#/components/responses/CsrfTokenMismatch" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /organisations/{organisation}/applications:
    parameters:
      - $ref: "#/components/parameters/OrganisationId"
    get:
      operationId: listApplications
      summary: List applications in an organisation
      description: |
        Returns a bounded tenant-scoped page enriched with compact Candidate and
        Job summaries. All active roles may list Applications. Query parameters
        are allow-listed and unsupported parameters are rejected.
      tags: [Application]
      security:
        - StatefulSession: []
      parameters:
        - name: job_id
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
        - name: candidate_id
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ApplicationStatus" }
        - name: sort
          in: query
          schema:
            {
              type: string,
              enum: [applied_at, updated_at],
              default: applied_at,
            }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Tenant-scoped paginated Applications.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationListResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/TenantNotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      operationId: createApplication
      summary: Create an application for an open job
      description: |
        Creates an `applied` Application and its initial status-history entry in
        one transaction. Organisation and actor come from trusted TenantContext.
        The Candidate and locked Job must belong to that Organisation, and the
        Job must still be `open`. Repeated Candidate/Job applications are not
        supported. Admin and Recruiter roles may create; status is not client-settable.
      tags: [Application]
      security:
        - StatefulSession: []
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApplicationRequest" }
      responses:
        "201":
          description: The Application and initial Applied history entry were created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ApplicationTargetNotFound" }
        "409": { $ref: "#/components/responses/ApplicationCreationConflict" }
        "419": { $ref: "#/components/responses/CsrfTokenMismatch" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /organisations/{organisation}/applications/{application}:
    parameters:
      - $ref: "#/components/parameters/OrganisationId"
      - $ref: "#/components/parameters/ApplicationId"
    get:
      operationId: getApplication
      summary: Get a tenant-scoped application
      description: |
        Resolves by trusted Organisation and Application ID together. A cross-tenant
        identifier and a nonexistent identifier have identical `404` semantics.
        All active roles may view. Status is changed only through the explicit
        transition operation, never through a generic edit endpoint.
      tags: [Application]
      security:
        - StatefulSession: []
      responses:
        "200":
          description: The tenant-scoped Application.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/ApplicationNotFound" }
  /organisations/{organisation}/applications/{application}/transitions:
    parameters:
      - $ref: "#/components/parameters/OrganisationId"
      - $ref: "#/components/parameters/ApplicationId"
    post:
      operationId: transitionApplication
      summary: Transition an Application to a valid pipeline status
      description: |
        Locks the tenant-scoped Application row, reads its persisted current
        status, authorises the exact current-to-target operation, validates the
        Domain transition graph, then updates status and appends an immutable
        history event atomically. The actor comes from trusted TenantContext.

        Admin and Recruiter may perform every valid transition. A Hiring Manager
        may perform only `interview` to `offer` or `interview` to `rejected`.
        Valid transitions are: `applied` to `screening` or `rejected`;
        `screening` to `interview` or `rejected`; `interview` to `offer` or
        `rejected`; and `offer` to `hired` or `rejected`. `hired` and `rejected`
        are terminal. Missing and cross-tenant Applications share `404` semantics.
      tags: [Application]
      security:
        - StatefulSession: []
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransitionApplicationRequest" }
      responses:
        "200":
          description: The authoritative Application representation after transition.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ApplicationTransitionForbidden" }
        "404": { $ref: "#/components/responses/ApplicationNotFound" }
        "409": { $ref: "#/components/responses/ApplicationTransitionConflict" }
        "419": { $ref: "#/components/responses/CsrfTokenMismatch" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /organisations/{organisation}/applications/{application}/history:
    parameters:
      - $ref: "#/components/parameters/OrganisationId"
      - $ref: "#/components/parameters/ApplicationId"
    get:
      operationId: listApplicationStatusHistory
      summary: Read an Application's immutable status timeline
      description: |
        Returns the complete, naturally bounded status timeline in deterministic
        `created_at`, then `id` order. All active roles may read it. History is
        append-only through application behaviour; no update or delete operation
        is exposed. Missing and cross-tenant Applications share `404` semantics.
      tags: [Application]
      security:
        - StatefulSession: []
      responses:
        "200":
          description: The Application status timeline in chronological order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationStatusHistoryResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/ApplicationNotFound" }
  /organisations/{organisation}/invitations:
    parameters:
      - $ref: "#/components/parameters/OrganisationId"
    get:
      operationId: listOrganisationInvitations
      summary: List organisation invitations
      description: |
        Lists invitations belonging to the trusted route organisation. An active
        Admin membership is required. Invitation token hashes and raw tokens are
        never returned.
      tags:
        - Organisation
      security:
        - StatefulSession: []
      responses:
        "200":
          description: The organisation invitations visible to an Admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationInvitationListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/TenantNotFound"
    post:
      operationId: createOrganisationInvitation
      summary: Invite a user to an organisation
      description: |
        Creates an invitation for a canonical email and fixed role. Invitations
        expire after a configurable period whose MVP default is seven days.
        The organisation and inviter are derived from the trusted tenant context.
        Existing active members and valid unresolved duplicate invitations are
        rejected with `409`. The raw token is delivered by email and is never
        returned by the API or stored in plaintext.
      tags:
        - Organisation
      security:
        - StatefulSession: []
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganisationInvitationRequest"
      responses:
        "201":
          description: The invitation was created and its notification was sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationInvitationResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/TenantNotFound"
        "409":
          $ref: "#/components/responses/InvitationConflict"
        "419":
          $ref: "#/components/responses/CsrfTokenMismatch"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /organisations/{organisation}/memberships:
    parameters:
      - $ref: "#/components/parameters/OrganisationId"
    get:
      operationId: listOrganisationMemberships
      summary: List organisation memberships
      description: |
        Lists active and deactivated memberships belonging to the trusted route
        organisation. An active Admin membership is required. Identity details
        are limited to the member identifier, name, and canonical email.
      tags:
        - Organisation
      security:
        - StatefulSession: []
      responses:
        "200":
          description: Active and deactivated memberships for the organisation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationMembershipListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/TenantNotFound"
  /organisations/{organisation}/memberships/{membership}:
    parameters:
      - $ref: "#/components/parameters/OrganisationId"
      - $ref: "#/components/parameters/MembershipId"
    patch:
      operationId: changeOrganisationMembershipRole
      summary: Change an active membership role
      description: |
        Changes an active membership to one of the fixed Organisation roles.
        The target is scoped to the trusted route organisation. The operation
        is idempotent when the requested role is already assigned. Demoting the
        final active Admin is rejected with `409`.
      tags:
        - Organisation
      security:
        - StatefulSession: []
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeOrganisationMembershipRoleRequest"
      responses:
        "200":
          description: The current membership representation after the role change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationMembershipResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/MembershipNotFound"
        "409":
          $ref: "#/components/responses/MembershipConflict"
        "419":
          $ref: "#/components/responses/CsrfTokenMismatch"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /organisations/{organisation}/memberships/{membership}/deactivate:
    parameters:
      - $ref: "#/components/parameters/OrganisationId"
      - $ref: "#/components/parameters/MembershipId"
    post:
      operationId: deactivateOrganisationMembership
      summary: Deactivate an organisation membership
      description: |
        Deactivates the tenant-scoped membership without deleting its historical
        row. Repeating the operation for an already-deactivated membership is
        idempotent and returns `204` while the requester still has active Admin
        access. A requester who deactivated their own membership no longer has
        tenant access and receives the normal tenant `404` on a later request.
        Deactivating the final active Admin is rejected with `409`.
      tags:
        - Organisation
      security:
        - StatefulSession: []
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
      responses:
        "204":
          description: The membership is deactivated or was already deactivated.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/MembershipNotFound"
        "409":
          $ref: "#/components/responses/MembershipConflict"
        "419":
          $ref: "#/components/responses/CsrfTokenMismatch"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /organisations/{organisation}/invitations/{invitation}/revoke:
    parameters:
      - $ref: "#/components/parameters/OrganisationId"
      - $ref: "#/components/parameters/InvitationId"
    post:
      operationId: revokeOrganisationInvitation
      summary: Revoke an organisation invitation
      description: |
        Revokes a pending invitation within the trusted route organisation.
        Repeating the operation for an already-revoked invitation is idempotent
        and returns `204`. An accepted invitation returns `409`. An invitation
        from another organisation has the same `404` response as a missing one.
      tags:
        - Organisation
      security:
        - StatefulSession: []
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
      responses:
        "204":
          description: The invitation is revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/InvitationNotFound"
        "409":
          description: The invitation has already been accepted and cannot be revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationConflictError"
        "419":
          $ref: "#/components/responses/CsrfTokenMismatch"
  /organisation-invitations/accept:
    post:
      operationId: acceptOrganisationInvitation
      summary: Accept an organisation invitation
      description: |
        Accepts an invitation without requiring an existing tenant membership.
        The bearer token must be valid, unresolved and unexpired, and the
        authenticated user's canonical email must match the invited email.
        The invitation supplies the organisation and role; the session supplies
        the user. Membership creation or reactivation and token consumption are
        atomic. Email verification is not required for this MVP flow.
      tags:
        - Organisation
      security:
        - StatefulSession: []
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptOrganisationInvitationRequest"
      responses:
        "204":
          description: The membership was created or reactivated and the invitation was accepted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "419":
          $ref: "#/components/responses/CsrfTokenMismatch"
        "422":
          description: |
            Input validation failed, or the invitation is invalid, expired,
            revoked, already accepted, or addressed to another canonical email.
            These invitation-state cases intentionally share a safe response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
  /sanctum/csrf-cookie:
    get:
      servers:
        - url: /
          description: Application origin outside the versioned API prefix
      security: []
      operationId: initialiseCsrfCookie
      summary: Initialise Sanctum CSRF protection
      description: |
        Initialises the first-party SPA CSRF cookie. The browser must accept the
        response cookies by using a credentialed request. For later
        state-changing requests, the client reads and URL-decodes the
        `XSRF-TOKEN` cookie and sends its value as `X-XSRF-TOKEN`. The session
        cookie remains HttpOnly and is sent by the browser, not read by
        JavaScript.
      tags:
        - Identity
      responses:
        "204":
          description: The CSRF cookie was initialised. The response has no body.
          headers:
            Set-Cookie:
              description: |
                Sets the `XSRF-TOKEN` cookie and may also establish the
                CareMatch session cookie. Multiple Set-Cookie header fields may
                be present.
              schema:
                type: string
components:
  securitySchemes:
    StatefulSession:
      type: apiKey
      in: cookie
      name: carematch_session
      description: |
        Laravel Sanctum stateful authentication for the first-party SPA. The
        HttpOnly session cookie is issued and rotated by the server. Browser
        clients must send requests with credentials. This scheme does not
        represent a Bearer token or a personal access token.
  parameters:
    OrganisationId:
      name: organisation
      in: path
      required: true
      description: The organisation identifier resolved against the authenticated user's active membership.
      schema:
        type: integer
        format: int64
        minimum: 1
    InvitationId:
      name: invitation
      in: path
      required: true
      description: Invitation identifier scoped to the trusted route organisation.
      schema:
        type: integer
        format: int64
        minimum: 1
    MembershipId:
      name: membership
      in: path
      required: true
      description: Membership identifier scoped to the trusted route organisation.
      schema:
        type: integer
        format: int64
        minimum: 1
    CandidateId:
      name: candidate
      in: path
      required: true
      description: Candidate identifier resolved only within the trusted route Organisation.
      schema:
        type: integer
        format: int64
        minimum: 1
    CandidateDocumentId:
      name: document
      in: path
      required: true
      description: |
        Document metadata identifier resolved together with the trusted route
        Organisation and Candidate. It is never a storage key.
      schema:
        type: integer
        format: int64
        minimum: 1
    JobId:
      name: job
      in: path
      required: true
      description: Job identifier resolved only within the trusted route Organisation.
      schema:
        type: integer
        format: int64
        minimum: 1
    ApplicationId:
      name: application
      in: path
      required: true
      description: Application identifier resolved only within the trusted route Organisation.
      schema:
        type: integer
        format: int64
        minimum: 1
    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: |
        URL-decoded value of the `XSRF-TOKEN` cookie obtained from
        `GET /sanctum/csrf-cookie`. Required by Laravel CSRF protection for
        state-changing first-party SPA requests.
      schema:
        type: string
        minLength: 1
  headers:
    RetryAfter:
      description: Number of seconds to wait before retrying the request.
      schema:
        type: integer
        minimum: 1
  responses:
    GuestOnlyConflict:
      description: An authenticated session cannot perform this guest-only operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConflictError"
    ValidationFailed:
      description: The submitted input failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    Unauthenticated:
      description: No authenticated stateful session is available.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnauthenticatedError"
    Forbidden:
      description: The active tenant member does not have the required role for this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ForbiddenError"
    TenantNotFound:
      description: |
        The organisation is nonexistent or is not available through an active
        membership for the authenticated user. These cases are intentionally
        indistinguishable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NotFoundError"
    CandidateNotFound:
      description: |
        The Candidate does not exist within the trusted route Organisation. A
        cross-tenant Candidate identifier and a nonexistent identifier are
        intentionally indistinguishable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NotFoundError"
    CandidateDocumentNotFound:
      description: |
        The Candidate or nested Document is missing or does not belong to the
        trusted route Organisation and Candidate. Cross-tenant, cross-Candidate,
        and nonexistent identifiers are intentionally indistinguishable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NotFoundError"
    CandidateDocumentStorageFailure:
      description: |
        Private storage or metadata persistence failed, or metadata points to a
        missing private object. Internal storage keys are never included.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CandidateDocumentStorageError"
    JobNotFound:
      description: |
        The Job does not exist within the trusted route Organisation. Cross-tenant
        and nonexistent identifiers are intentionally indistinguishable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/NotFoundError" }
    JobTransitionConflict:
      description: The requested Job lifecycle transition is not valid from its locked current status.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/JobTransitionConflictError" }
    ApplicationNotFound:
      description: A cross-tenant and a nonexistent Application identifier are intentionally indistinguishable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/NotFoundError" }
    ApplicationTargetNotFound:
      description: The Job or Candidate does not exist within the trusted route Organisation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/NotFoundError" }
    ApplicationCreationConflict:
      description: The locked Job is not Open, or the Candidate already has an Application for the Job.
      content:
        application/json:
          schema:
            { $ref: "#/components/schemas/ApplicationCreationConflictError" }
    ApplicationTransitionForbidden:
      description: The active member's persisted role does not permit the exact locked-status transition.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApplicationTransitionForbiddenError" }
    ApplicationTransitionConflict:
      description: The requested transition is invalid from the locked current Application status.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApplicationTransitionConflictError" }
    InvitationNotFound:
      description: The invitation does not exist within the trusted route organisation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NotFoundError"
    InvitationConflict:
      description: The invitee is already active or a valid unresolved invitation exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InvitationConflictError"
    MembershipNotFound:
      description: The membership does not exist within the trusted route organisation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NotFoundError"
    MembershipConflict:
      description: The requested operation conflicts with membership state or the last-Admin invariant.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MembershipConflictError"
    CsrfTokenMismatch:
      description: The CSRF token is missing, invalid, or no longer matches the session.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CsrfError"
    RateLimited:
      description: Too many requests were made for the applicable public operation.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RateLimitError"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - status
            - service
          properties:
            status:
              type: string
              const: ok
            service:
              type: string
              const: carematch-api
    User:
      type: object
      additionalProperties: false
      description: A global CareMatch identity user.
      required:
        - id
        - name
        - email
        - created_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
          description: Normalised lowercase email without surrounding whitespace.
        created_at:
          type: string
          format: date-time
    UserResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/User"
    OrganisationRole:
      type: string
      description: Fixed role assigned to a membership within one organisation.
      enum:
        - admin
        - recruiter
        - hiring_manager
    OrganisationMembershipSummary:
      type: object
      additionalProperties: false
      required:
        - role
      properties:
        role:
          $ref: "#/components/schemas/OrganisationRole"
    OrganisationMemberIdentity:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - email
      properties:
        id:
