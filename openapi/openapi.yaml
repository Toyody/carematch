openapi: 3.1.0
info:
  title: CareMatch API
  version: 0.3.0
  description: |
    REST API for the CareMatch healthcare recruitment platform.

    The first-party SPA authenticates with a Laravel Sanctum stateful
    cookie session. Browser clients must first call `GET /sanctum/csrf-cookie`,
    include credentials on subsequent requests, and send the decoded
    `XSRF-TOKEN` cookie value in the `X-XSRF-TOKEN` header on state-changing
    requests.

    CareMatch does not expose personal access token issuing or management APIs
    in Phase 2-A. Phase 2-B1 adds organisation creation and active membership
    listing without introducing a global tenant context.
  license:
    name: All rights reserved
servers:
  - url: /api/v1
    description: Version 1 API
paths:
  /health:
    get:
      security: []
      operationId: getHealth
      summary: Check API availability
      tags:
        - System
      responses:
        "200":
          description: The API is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /auth/register:
    post:
      security: []
      operationId: registerUser
      summary: Register a global user
      description: |
        Creates a global CareMatch user without creating Organisation or
        membership data. The new user is authenticated with the web session and
        the session identifier is regenerated. An already authenticated session
        is rejected by the guest-only API policy.
      tags:
        - Identity
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: The user was registered and authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "409":
          $ref: "#/components/responses/GuestOnlyConflict"
        "419":
          $ref: "#/components/responses/CsrfTokenMismatch"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/login:
    post:
      security: []
      operationId: loginUser
      summary: Log in with a web session
      description: |
        Authenticates the normalised email and password using Laravel's web
        guard, then regenerates the session identifier. Unknown email addresses
        and incorrect passwords return the same public failure. Remember-me is
        not supported. An already authenticated session is rejected.
      tags:
        - Identity
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: The credentials are incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialFailure"
        "409":
          $ref: "#/components/responses/GuestOnlyConflict"
        "419":
          $ref: "#/components/responses/CsrfTokenMismatch"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Get the current global user
      description: Returns the user authenticated by the stateful cookie session.
      tags:
        - Identity
      security:
        - StatefulSession: []
      responses:
        "200":
          description: The authenticated global user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /auth/logout:
    post:
      operationId: logoutUser
      summary: Log out the current session
      description: |
        Logs out the Laravel web guard, invalidates the current session, and
        regenerates the CSRF token.
      tags:
        - Identity
      security:
        - StatefulSession: []
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
      responses:
        "204":
          description: The current session was logged out and invalidated.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "419":
          $ref: "#/components/responses/CsrfTokenMismatch"
  /auth/forgot-password:
    post:
      security: []
      operationId: requestPasswordReset
      summary: Request a password reset link
      description: |
        Requests Laravel's standard password reset notification. The public
        response is identical whether or not the email belongs to a user. An
        already authenticated session is rejected by the guest-only API policy.
      tags:
        - Identity
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: The password reset request was accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgotPasswordAcceptedResponse"
        "409":
          $ref: "#/components/responses/GuestOnlyConflict"
        "419":
          $ref: "#/components/responses/CsrfTokenMismatch"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/reset-password:
    post:
      security: []
      operationId: resetPassword
      summary: Reset a password
      description: |
        Uses Laravel Password Broker to validate and consume the reset token.
        Success changes the password, rotates the remember token, and invalidates
        all database-backed sessions belonging to the user. It does not
        automatically log the user in. Invalid, expired, and previously used
        tokens share the same validation error contract. An already authenticated
        session is rejected.
      tags:
        - Identity
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: The password was reset and existing user sessions were invalidated.
        "409":
          $ref: "#/components/responses/GuestOnlyConflict"
        "419":
          $ref: "#/components/responses/CsrfTokenMismatch"
        "422":
          description: |
            Input validation failed, or the reset token is invalid, expired, or
            has already been used.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /organisations:
    get:
      operationId: listOrganisations
      summary: List the current user's organisations
      description: |
        Returns only organisations for which the authenticated global user has
        an active membership. A membership is active when it has not been
        deactivated. The response includes that user's fixed role in each
        organisation.
      tags:
        - Organisation
      security:
        - StatefulSession: []
      responses:
        "200":
          description: The organisations with active memberships for the current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createOrganisation
      summary: Create an organisation
      description: |
        Atomically creates an organisation and an active initial membership for
        the authenticated global user with the `admin` role. Ownership and role
        identifiers are derived by the server and are not accepted from the
        client.
      tags:
        - Organisation
      security:
        - StatefulSession: []
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganisationRequest"
      responses:
        "201":
          description: The organisation and initial Admin membership were created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "419":
          $ref: "#/components/responses/CsrfTokenMismatch"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /sanctum/csrf-cookie:
    get:
      servers:
        - url: /
          description: Application origin outside the versioned API prefix
      security: []
      operationId: initialiseCsrfCookie
      summary: Initialise Sanctum CSRF protection
      description: |
        Initialises the first-party SPA CSRF cookie. The browser must accept the
        response cookies by using a credentialed request. For later
        state-changing requests, the client reads and URL-decodes the
        `XSRF-TOKEN` cookie and sends its value as `X-XSRF-TOKEN`. The session
        cookie remains HttpOnly and is sent by the browser, not read by
        JavaScript.
      tags:
        - Identity
      responses:
        "204":
          description: The CSRF cookie was initialised. The response has no body.
          headers:
            Set-Cookie:
              description: |
                Sets the `XSRF-TOKEN` cookie and may also establish the
                CareMatch session cookie. Multiple Set-Cookie header fields may
                be present.
              schema:
                type: string
components:
  securitySchemes:
    StatefulSession:
      type: apiKey
      in: cookie
      name: carematch_session
      description: |
        Laravel Sanctum stateful authentication for the first-party SPA. The
        HttpOnly session cookie is issued and rotated by the server. Browser
        clients must send requests with credentials. This scheme does not
        represent a Bearer token or a personal access token.
  parameters:
    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: |
        URL-decoded value of the `XSRF-TOKEN` cookie obtained from
        `GET /sanctum/csrf-cookie`. Required by Laravel CSRF protection for
        state-changing first-party SPA requests.
      schema:
        type: string
        minLength: 1
  headers:
    RetryAfter:
      description: Number of seconds to wait before retrying the request.
      schema:
        type: integer
        minimum: 1
  responses:
    GuestOnlyConflict:
      description: An authenticated session cannot perform this guest-only operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConflictError"
    ValidationFailed:
      description: The submitted input failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    Unauthenticated:
      description: No authenticated stateful session is available.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnauthenticatedError"
    CsrfTokenMismatch:
      description: The CSRF token is missing, invalid, or no longer matches the session.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CsrfError"
    RateLimited:
      description: Too many requests were made for the applicable public operation.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RateLimitError"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - status
            - service
          properties:
            status:
              type: string
              const: ok
            service:
              type: string
              const: carematch-api
    User:
      type: object
      additionalProperties: false
      description: A global CareMatch identity user.
      required:
        - id
        - name
        - email
        - created_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
          description: Normalised lowercase email without surrounding whitespace.
        created_at:
          type: string
          format: date-time
    UserResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/User"
    OrganisationRole:
      type: string
      description: Fixed role assigned to a membership within one organisation.
      enum:
        - admin
        - recruiter
        - hiring_manager
    OrganisationMembershipSummary:
      type: object
      additionalProperties: false
      required:
        - role
      properties:
        role:
          $ref: "#/components/schemas/OrganisationRole"
    Organisation:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - membership
        - created_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 255
        membership:
          $ref: "#/components/schemas/OrganisationMembershipSummary"
        created_at:
          type: string
          format: date-time
    OrganisationResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/Organisation"
    OrganisationListResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Organisation"
    CreateOrganisationRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - email
        - password
        - password_confirmation
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
          description: Trimmed and lowercased before validation and registration.
        password:
          type: string
          format: password
          minLength: 12
          x-maximumBytes: 72
          description: |
            Must contain at least 12 characters and must not exceed 72 bytes in
            its PHP string representation because bcrypt is used. NUL bytes are
            not supported. The byte limit is not a 72-character limit.
        password_confirmation:
          type: string
          format: password
          description: Required and must exactly match `password`.
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: Trimmed and lowercased before validation and authentication.
        password:
          type: string
          format: password
          minLength: 1
          description: |
            The existing account password. Password-creation rules are not
            reapplied at login. Credential values that cannot be safely passed
            to the configured bcrypt hasher are treated as incorrect
            credentials and return the same `401` response.
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: Trimmed and lowercased before validation and broker lookup.
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - email
        - password
        - password_confirmation
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 255
          description: Opaque password reset token delivered by the standard reset notification.
        email:
          type: string
          format: email
          maxLength: 255
          description: Trimmed and lowercased before validation and broker lookup.
        password:
          type: string
          format: password
          minLength: 12
          x-maximumBytes: 72
          description: |
            Must contain at least 12 characters and must not exceed 72 bytes in
            its PHP string representation because bcrypt is used. NUL bytes are
            not supported. The byte limit is not a 72-character limit.
        password_confirmation:
          type: string
          format: password
          description: Required and must exactly match `password`.
    ValidationError:
      type: object
      required:
        - message
        - errors
      properties:
        message:
          type: string
          example: The given data was invalid.
        errors:
          type: object
          description: Validation messages keyed by request field.
          additionalProperties:
            type: array
            items:
              type: string
    UnauthenticatedError:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          const: Unauthenticated.
    CsrfError:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          const: CSRF token mismatch.
    ConflictError:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          const: An authenticated user cannot perform this operation.
    RateLimitError:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          const: Too many attempts. Please try again later.
    CredentialFailure:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          const: The provided credentials are incorrect.
    ForgotPasswordAcceptedResponse:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          const: If an account exists for that email, a password reset link will be sent.
tags:
  - name: Identity
    description: First-party stateful SPA identity and password lifecycle operations.
  - name: Organisation
    description: Organisation and active membership foundation operations.
  - name: System
    description: Operational endpoints for the CareMatch API.
