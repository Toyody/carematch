            $ref: "#/components/schemas/Organisation"
    Candidate:
      type: object
      additionalProperties: false
      description: A Candidate record owned by the route Organisation.
      required:
        - id
        - first_name
        - last_name
        - email
        - phone
        - occupation
        - location
        - availability
        - notes
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type:
            - string
            - "null"
          format: email
          maxLength: 255
          description: Candidate contact email, trimmed and lowercased when present. It is not an Identity account and is not unique.
        phone:
          type:
            - string
            - "null"
          maxLength: 50
        occupation:
          type:
            - string
            - "null"
          maxLength: 255
        location:
          type:
            - string
            - "null"
          maxLength: 255
        availability:
          type:
            - string
            - "null"
          maxLength: 255
        notes:
          type:
            - string
            - "null"
          maxLength: 5000
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CandidateResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/Candidate"
    CandidateDocument:
      type: object
      additionalProperties: false
      description: |
        Safe metadata for a privately stored Candidate document. The internal
        storage key, path, public URL, Organisation ID, and Candidate ID are omitted.
      required:
        - id
        - original_name
        - mime_type
        - size_bytes
        - uploaded_by_user_id
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        original_name:
          type: string
          minLength: 1
          maxLength: 255
          description: Safe display and attachment metadata only; never used as a storage path.
        mime_type:
          type: string
          enum:
            - application/pdf
            - application/vnd.openxmlformats-officedocument.wordprocessingml.document
          description: MIME detected from file content by the backend.
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 10485760
        uploaded_by_user_id:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CandidateDocumentResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/CandidateDocument"
    CandidateDocumentListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CandidateDocument"
    CandidateDocumentUploadRequest:
      type: object
      additionalProperties: false
      required: [document]
      properties:
        document:
          type: string
          format: binary
          description: |
            Non-empty PDF or DOCX, maximum 10 MiB (10,485,760 bytes).
            The backend uses server-side content MIME detection and does not
            trust the extension or browser-supplied MIME value.
    CandidatePaginationLinks:
      type: object
      additionalProperties: false
      required:
        - first
        - last
        - prev
        - next
      properties:
        first:
          type: string
          format: uri
        last:
          type: string
          format: uri
        prev:
          type:
            - string
            - "null"
          format: uri
        next:
          type:
            - string
            - "null"
          format: uri
    CandidatePaginationMeta:
      type: object
      additionalProperties: false
      required:
        - current_page
        - from
        - last_page
        - path
        - per_page
        - to
        - total
      properties:
        current_page:
          type: integer
          minimum: 1
        from:
          type:
            - integer
            - "null"
          minimum: 1
        last_page:
          type: integer
          minimum: 1
        path:
          type: string
          format: uri
        per_page:
          type: integer
          minimum: 1
          maximum: 100
        to:
          type:
            - integer
            - "null"
          minimum: 1
        total:
          type: integer
          minimum: 0
    CandidateListResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Candidate"
        links:
          $ref: "#/components/schemas/CandidatePaginationLinks"
        meta:
          $ref: "#/components/schemas/CandidatePaginationMeta"
    CandidateWritableFields:
      type: object
      additionalProperties: false
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type:
            - string
            - "null"
          format: email
          maxLength: 255
          description: Trimmed and lowercased before persistence. Duplicate Candidate emails are allowed.
        phone:
          type:
            - string
            - "null"
          maxLength: 50
        occupation:
          type:
            - string
            - "null"
          maxLength: 255
        location:
          type:
            - string
            - "null"
          maxLength: 255
        availability:
          type:
            - string
            - "null"
          maxLength: 255
        notes:
          type:
            - string
            - "null"
          maxLength: 5000
    CreateCandidateRequest:
      allOf:
        - $ref: "#/components/schemas/CandidateWritableFields"
        - type: object
          required:
            - first_name
            - last_name
    UpdateCandidateRequest:
      $ref: "#/components/schemas/CandidateWritableFields"
    JobStatus:
      type: string
      enum: [draft, open, closed, archived]
    Job:
      type: object
      additionalProperties: false
      description: A Job profile owned by the trusted route Organisation.
      required:
        - id
        - title
        - occupation
        - location
        - employment_type
        - description
        - status
        - opened_at
        - closes_at
        - created_at
        - updated_at
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 200 }
        occupation: { type: [string, "null"], maxLength: 255 }
        location: { type: [string, "null"], maxLength: 255 }
        employment_type: { type: [string, "null"], maxLength: 100 }
        description: { type: [string, "null"], maxLength: 10000 }
        status: { $ref: "#/components/schemas/JobStatus" }
        opened_at: { type: [string, "null"], format: date-time }
        closes_at:
          type: [string, "null"]
          format: date-time
          description: When both dates are present, this must be at or after `opened_at`.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    JobResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Job" }
    JobPaginationLinks:
      type: object
      additionalProperties: false
      required: [first, last, prev, next]
      properties:
        first: { type: string, format: uri }
        last: { type: string, format: uri }
        prev: { type: [string, "null"], format: uri }
        next: { type: [string, "null"], format: uri }
    JobPaginationMeta:
      type: object
      additionalProperties: false
      required: [current_page, from, last_page, path, per_page, to, total]
      properties:
        current_page: { type: integer, minimum: 1 }
        from: { type: [integer, "null"], minimum: 1 }
        last_page: { type: integer, minimum: 1 }
        path: { type: string, format: uri }
        per_page: { type: integer, minimum: 1, maximum: 100 }
        to: { type: [integer, "null"], minimum: 1 }
        total: { type: integer, minimum: 0 }
    JobListResponse:
      type: object
      additionalProperties: false
      required: [data, links, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Job" }
        links: { $ref: "#/components/schemas/JobPaginationLinks" }
        meta: { $ref: "#/components/schemas/JobPaginationMeta" }
    JobWritableFields:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        occupation: { type: [string, "null"], maxLength: 255 }
        location: { type: [string, "null"], maxLength: 255 }
        employment_type: { type: [string, "null"], maxLength: 100 }
        description: { type: [string, "null"], maxLength: 10000 }
        opened_at: { type: [string, "null"], format: date-time }
        closes_at:
          type: [string, "null"]
          format: date-time
          description: When both dates are present, this must be at or after `opened_at`.
    CreateJobRequest:
      allOf:
        - $ref: "#/components/schemas/JobWritableFields"
        - type: object
          required: [title]
    UpdateJobRequest:
      $ref: "#/components/schemas/JobWritableFields"
    ApplicationStatus:
      type: string
      enum: [applied, screening, interview, offer, hired, rejected]
      description: |
        Recruitment pipeline status. Applications start at `applied`. The valid
        graph is applied -> screening -> interview -> offer -> hired, with
        rejected reachable from applied, screening, interview, or offer. Hired
        and Rejected are terminal.
    ApplicationJobSummary:
      type: object
      additionalProperties: false
      required: [id, title]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 200 }
    ApplicationCandidateSummary:
      type: object
      additionalProperties: false
      required: [id, first_name, last_name]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        first_name: { type: string, minLength: 1, maxLength: 100 }
        last_name: { type: string, minLength: 1, maxLength: 100 }
    Application:
      type: object
      additionalProperties: false
      required:
        [
          id,
          job,
          candidate,
          status,
          applied_at,
          created_by_user_id,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        job: { $ref: "#/components/schemas/ApplicationJobSummary" }
        candidate: { $ref: "#/components/schemas/ApplicationCandidateSummary" }
        status: { $ref: "#/components/schemas/ApplicationStatus" }
        applied_at: { type: string, format: date-time }
        created_by_user_id: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ApplicationResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Application" }
    ApplicationPaginationLinks:
      $ref: "#/components/schemas/JobPaginationLinks"
    ApplicationPaginationMeta:
      $ref: "#/components/schemas/JobPaginationMeta"
    ApplicationListResponse:
      type: object
      additionalProperties: false
      required: [data, links, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Application" }
        links: { $ref: "#/components/schemas/ApplicationPaginationLinks" }
        meta: { $ref: "#/components/schemas/ApplicationPaginationMeta" }
    CreateApplicationRequest:
      type: object
      additionalProperties: false
      required: [job_id, candidate_id]
      properties:
        job_id: { type: integer, format: int64, minimum: 1 }
        candidate_id: { type: integer, format: int64, minimum: 1 }
    TransitionApplicationRequest:
      type: object
      additionalProperties: false
      required: [to_status]
      properties:
        to_status: { $ref: "#/components/schemas/ApplicationStatus" }
        note:
          type: [string, "null"]
          maxLength: 1000
          description: Optional trimmed transition note. An empty trimmed value is stored as null.
    ApplicationStatusHistoryEvent:
      type: object
      additionalProperties: false
      required: [id, from_status, to_status, changed_by_user_id, note, created_at]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        from_status:
          oneOf:
            - $ref: "#/components/schemas/ApplicationStatus"
            - type: "null"
          description: Null only for the initial Application-created event.
        to_status: { $ref: "#/components/schemas/ApplicationStatus" }
        changed_by_user_id:
          type: integer
          format: int64
          minimum: 1
          description: Trusted authenticated actor recorded by the server.
        note: { type: [string, "null"], maxLength: 1000 }
        created_at: { type: string, format: date-time }
    ApplicationStatusHistoryResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ApplicationStatusHistoryEvent" }
    OrganisationInvitation:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - role
        - expires_at
        - accepted_at
        - revoked_at
        - created_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        email:
          type: string
          format: email
          maxLength: 255
          description: Canonical trimmed and lowercased invited email.
        role:
          $ref: "#/components/schemas/OrganisationRole"
        expires_at:
          type: string
          format: date-time
        accepted_at:
          type:
            - string
            - "null"
          format: date-time
        revoked_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
    OrganisationInvitationResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/OrganisationInvitation"
    OrganisationInvitationListResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/OrganisationInvitation"
    CreateOrganisationInvitationRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - role
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: Trimmed and lowercased before validation and invitation creation.
        role:
          $ref: "#/components/schemas/OrganisationRole"
    AcceptOrganisationInvitationRequest:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 255
          description: Opaque raw invitation token delivered to the invited email address.
    CreateOrganisationRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
    UpdateOrganisationRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - email
        - password
        - password_confirmation
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
          description: Trimmed and lowercased before validation and registration.
        password:
          type: string
          format: password
          minLength: 12
          x-maximumBytes: 72
          description: |
            Must contain at least 12 characters and must not exceed 72 bytes in
            its PHP string representation because bcrypt is used. NUL bytes are
            not supported. The byte limit is not a 72-character limit.
        password_confirmation:
          type: string
          format: password
          description: Required and must exactly match `password`.
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: Trimmed and lowercased before validation and authentication.
        password:
          type: string
          format: password
          minLength: 1
          description: |
            The existing account password. Password-creation rules are not
            reapplied at login. Credential values that cannot be safely passed
            to the configured bcrypt hasher are treated as incorrect
            credentials and return the same `401` response.
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: Trimmed and lowercased before validation and broker lookup.
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - email
        - password
        - password_confirmation
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 255
          description: Opaque password reset token delivered by the standard reset notification.
        email:
          type: string
          format: email
          maxLength: 255
          description: Trimmed and lowercased before validation and broker lookup.
        password:
          type: string
          format: password
          minLength: 12
          x-maximumBytes: 72
          description: |
            Must contain at least 12 characters and must not exceed 72 bytes in
            its PHP string representation because bcrypt is used. NUL bytes are
            not supported. The byte limit is not a 72-character limit.
        password_confirmation:
          type: string
          format: password
          description: Required and must exactly match `password`.
    ValidationError:
      type: object
      required:
        - message
        - errors
      properties:
        message:
          type: string
          example: The given data was invalid.
        errors:
          type: object
          description: Validation messages keyed by request field.
          additionalProperties:
            type: array
            items:
              type: string
    UnauthenticatedError:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          const: Unauthenticated.
    ForbiddenError:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          const: This action is unauthorized.
    NotFoundError:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          const: Not Found
    CandidateDocumentStorageError:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          enum:
            - The document could not be stored. Please try again.
            - The document is temporarily unavailable.
            - The document could not be deleted. Please try again.
    CsrfError:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          const: CSRF token mismatch.
    ConflictError:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          const: An authenticated user cannot perform this operation.
    InvitationConflictError:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          enum:
            - The user is already an active member of this organisation.
            - An unresolved invitation already exists for this email.
            - An accepted invitation cannot be revoked.
    MembershipConflictError:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          enum:
            - An organisation must retain at least one active Admin.
            - A deactivated membership role cannot be changed.
    JobTransitionConflictError:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          const: The requested job status transition is not allowed.
    ApplicationCreationConflictError:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          enum:
            - Applications may only be created for an open job.
            - This candidate already has an application for this job.
    ApplicationTransitionForbiddenError:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          const: Your Organisation role cannot perform this application transition.
    ApplicationTransitionConflictError:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          const: The requested application status transition is not allowed.
    RateLimitError:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          const: Too many attempts. Please try again later.
    CredentialFailure:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          const: The provided credentials are incorrect.
    ForgotPasswordAcceptedResponse:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          const: If an account exists for that email, a password reset link will be sent.
tags:
  - name: Identity
    description: First-party stateful SPA identity and password lifecycle operations.
  - name: Organisation
    description: Organisation and active membership foundation operations.
  - name: Candidate
    description: Tenant-owned Candidate profile and private document operations.
  - name: Job
    description: Tenant-owned Job profile and explicit lifecycle operations.
  - name: System
    description: Operational endpoints for the CareMatch API.
