name: carematch-backup-restore

services:
  source-postgres:
    image: postgis/postgis:18-3.6
    platform: linux/amd64
    environment:
      POSTGRES_DB: carematch_rehearsal_source
      POSTGRES_USER: carematch
      POSTGRES_PASSWORD: rehearsal_only
    volumes:
      - backup_source_data:/var/lib/postgresql
      - ${PREDEPLOYMENT_TMP_DIR:?PREDEPLOYMENT_TMP_DIR is required}:/rehearsal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U carematch -d carematch_rehearsal_source"]
      interval: 3s
      timeout: 3s
      retries: 20

  restore-postgres:
    image: postgis/postgis:18-3.6
    platform: linux/amd64
    environment:
      POSTGRES_DB: carematch_rehearsal_restore
      POSTGRES_USER: carematch
      POSTGRES_PASSWORD: rehearsal_only
    volumes:
      - backup_restore_data:/var/lib/postgresql
      - ${PREDEPLOYMENT_TMP_DIR:?PREDEPLOYMENT_TMP_DIR is required}:/rehearsal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U carematch -d carematch_rehearsal_restore"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: predeployment
      APP_DEBUG: "false"
      APP_KEY: ${PREDEPLOYMENT_APP_KEY:?PREDEPLOYMENT_APP_KEY is required}
      DB_CONNECTION: pgsql
      DB_HOST: source-postgres
      DB_PORT: 5432
      DB_DATABASE: carematch_rehearsal_source
      DB_USERNAME: carematch
      DB_PASSWORD: rehearsal_only
      CACHE_STORE: array
      SESSION_DRIVER: database
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      CARE_MATCH_DEMO_DATA: "true"
      CARE_MATCH_DEMO_EMAIL: rehearsal.admin@example.test
      CARE_MATCH_DEMO_PASSWORD: ${PREDEPLOYMENT_PASSWORD:?PREDEPLOYMENT_PASSWORD is required}

volumes:
  backup_source_data:
  backup_restore_data:
