name: Deploy production

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: AWS region containing the pre-provisioned CareMatch resources
        required: true
        type: string
      production_url:
        description: HTTPS same-origin URL, for example https://carematch.example.com
        required: true
        type: string
      environment:
        description: Protected GitHub Environment containing deployment variables
        required: true
        default: production
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, migrate and deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: ${{ inputs.aws_region }}
      PRODUCTION_URL: ${{ inputs.production_url }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      ECR_BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
      ECR_FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_BACKEND_SERVICE: ${{ vars.ECS_BACKEND_SERVICE }}
      ECS_FRONTEND_SERVICE: ${{ vars.ECS_FRONTEND_SERVICE }}
      ECS_WORKER_SERVICE: ${{ vars.ECS_WORKER_SERVICE }}
      ECS_AI_WORKER_SERVICE: ${{ vars.ECS_AI_WORKER_SERVICE }}
      ECS_BACKEND_TASK_FAMILY: ${{ vars.ECS_BACKEND_TASK_FAMILY }}
      ECS_FRONTEND_TASK_FAMILY: ${{ vars.ECS_FRONTEND_TASK_FAMILY }}
      ECS_WORKER_TASK_FAMILY: ${{ vars.ECS_WORKER_TASK_FAMILY }}
      ECS_AI_WORKER_TASK_FAMILY: ${{ vars.ECS_AI_WORKER_TASK_FAMILY }}
      ECS_TASK_SUBNETS: ${{ vars.ECS_TASK_SUBNETS }}
      ECS_TASK_SECURITY_GROUPS: ${{ vars.ECS_TASK_SECURITY_GROUPS }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PRODUCTION_URL" == https://* ]] || { echo "production_url must use HTTPS" >&2; exit 1; }
          for name in AWS_DEPLOY_ROLE_ARN ECR_BACKEND_REPOSITORY ECR_FRONTEND_REPOSITORY ECS_CLUSTER ECS_BACKEND_SERVICE ECS_FRONTEND_SERVICE ECS_WORKER_SERVICE ECS_AI_WORKER_SERVICE ECS_BACKEND_TASK_FAMILY ECS_FRONTEND_TASK_FAMILY ECS_WORKER_TASK_FAMILY ECS_AI_WORKER_TASK_FAMILY ECS_TASK_SUBNETS ECS_TASK_SECURITY_GROUPS; do
            [[ -n "${!name:-}" ]] || { echo "Missing GitHub Environment variable: $name" >&2; exit 1; }
          done

      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -f backend/Dockerfile.production -t "$REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG" backend
          docker build \
            -f frontend/Dockerfile.production \
            --build-arg NEXT_PUBLIC_API_URL= \
            --build-arg NEXT_PUBLIC_CARE_MATCH_PUBLIC_DEMO=true \
            -t "$REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG" \
            frontend
          docker push "$REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG"

      - name: Read current ECS task definitions
        run: |
          set -euo pipefail
          aws ecs describe-task-definition --task-definition "$ECS_BACKEND_TASK_FAMILY" --query taskDefinition > backend-current.json
          aws ecs describe-task-definition --task-definition "$ECS_FRONTEND_TASK_FAMILY" --query taskDefinition > frontend-current.json
          aws ecs describe-task-definition --task-definition "$ECS_WORKER_TASK_FAMILY" --query taskDefinition > worker-current.json
          aws ecs describe-task-definition --task-definition "$ECS_AI_WORKER_TASK_FAMILY" --query taskDefinition > ai-worker-current.json
          jq 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' backend-current.json > backend-task.json
          jq 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' frontend-current.json > frontend-task.json
          jq 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' worker-current.json > worker-task.json
          jq 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' ai-worker-current.json > ai-worker-task.json

      - name: Render backend task definition
        id: backend-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: backend-task.json
          container-name: backend
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ github.sha }}

      - name: Render frontend task definition
        id: frontend-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: frontend-task.json
          container-name: frontend
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPOSITORY }}:${{ github.sha }}

      - name: Render worker task definition from the same backend image
        id: worker-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: worker-task.json
          container-name: worker
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ github.sha }}

      - name: Render AI worker task definition from the same backend image
        id: ai-worker-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ai-worker-task.json
          container-name: ai-worker
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ github.sha }}

      - name: Register backend task definition
        id: register-backend
        shell: bash
        run: |
          set -euo pipefail
          TASK_DEFINITION_ARN=$(aws ecs register-task-definition \
            --cli-input-json "file://${{ steps.backend-task.outputs.task-definition }}" \
            --query taskDefinition.taskDefinitionArn \
            --output text)
          [[ "$TASK_DEFINITION_ARN" == arn:* ]] || { echo "Backend task registration failed" >&2; exit 1; }
          echo "task_definition_arn=$TASK_DEFINITION_ARN" >> "$GITHUB_OUTPUT"

      - name: Run database migrations as a one-off ECS task
        id: migration
        shell: bash
        run: |
          set -euo pipefail
          NETWORK="awsvpcConfiguration={subnets=[$ECS_TASK_SUBNETS],securityGroups=[$ECS_TASK_SECURITY_GROUPS],assignPublicIp=ENABLED}"
          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --task-definition "${{ steps.register-backend.outputs.task_definition_arn }}" \
            --network-configuration "$NETWORK" \
            --overrides '{"containerOverrides":[{"name":"backend","command":["php","artisan","migrate","--force"]}]}' \
            --query 'tasks[0].taskArn' \
            --output text)
          [[ "$TASK_ARN" == arn:* ]] || { echo "Migration task did not start" >&2; exit 1; }
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN" \
            --query "tasks[0].containers[?name=='backend'].exitCode | [0]" \
            --output text)
          [[ "$EXIT_CODE" == "0" ]] || { echo "Migration task failed with exit code $EXIT_CODE" >&2; exit 1; }

      - name: Deploy backend service and wait for stabilization
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.backend-task.outputs.task-definition }}
          service: ${{ env.ECS_BACKEND_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Deploy frontend service and wait for stabilization
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.frontend-task.outputs.task-definition }}
          service: ${{ env.ECS_FRONTEND_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Deploy worker service and wait for stabilization
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.worker-task.outputs.task-definition }}
          service: ${{ env.ECS_WORKER_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Deploy AI worker service and wait for stabilization
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.ai-worker-task.outputs.task-definition }}
          service: ${{ env.ECS_AI_WORKER_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Verify HTTPS application and API
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error "$PRODUCTION_URL/" >/dev/null
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error "$PRODUCTION_URL/api/v1/health" >/dev/null
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error "$PRODUCTION_URL/sanctum/csrf-cookie" >/dev/null
