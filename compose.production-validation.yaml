name: carematch-production-validation

services:
  postgres:
    image: postgis/postgis:18-3.6
    platform: linux/amd64
    environment:
      POSTGRES_DB: carematch_production_validation
      POSTGRES_USER: carematch
      POSTGRES_PASSWORD: production_validation_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U carematch -d carematch_production_validation"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - production_validation_postgres:/var/lib/postgresql

  redis:
    image: redis:8.2.10-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${PRODUCTION_VALIDATION_APP_KEY:?PRODUCTION_VALIDATION_APP_KEY is required}
      APP_URL: http://localhost:8080
      FRONTEND_URL: http://localhost:8080
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: carematch_production_validation
      DB_USERNAME: carematch
      DB_PASSWORD: production_validation_only
      SESSION_DRIVER: database
      SESSION_COOKIE: carematch_session
      SESSION_SECURE_COOKIE: "false"
      SESSION_HTTP_ONLY: "true"
      SESSION_SAME_SITE: lax
      SANCTUM_STATEFUL_DOMAINS: localhost:8080
      CACHE_STORE: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      MAIL_MAILER: array
      CANDIDATE_DOCUMENTS_DISK: candidate_documents
      CARE_MATCH_PUBLIC_DEMO: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_CARE_MATCH_PUBLIC_DEMO: "true"

  gateway:
    image: nginx:1.29-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./docker/production-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  production_validation_postgres:
